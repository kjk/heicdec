# CI for heicdec — host build, amalgamation, full pixel-oracle tests against
# libheif on Windows, Linux, and macOS, plus fuzz crash regression and WASM.
# The JCT-VC range-extensions conformance set runs on Linux only
# (HEIC_SKIP_REXT=1 on the other two).
#
# `bun cmd/tests.ts -all` builds the oracle stack (dav1d + libde265 + libheif)
# and needs deps/ + deps/testimages. Both are cached per OS so cold runs pay
# clone/download/build once and warm runs stay shorter.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache

jobs:
  windows-msvc:
    name: Windows MSVC + tests
    runs-on: windows-latest
    timeout-minutes: 120
    # The RExt conformance set (49 streams) runs on Linux only: it checks the
    # portable C decoder against MD5s and tripled the run time here.
    env:
      HEIC_SKIP_REXT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install meson/ninja/nasm
        shell: pwsh
        run: |
          python -m pip install --upgrade meson
          choco install ninja nasm -y --no-progress
          # choco ninja/nasm may land off PATH until the next shell; add common dirs.
          $extra = @(
            "C:\ProgramData\chocolatey\bin",
            "C:\Program Files\NASM"
          )
          foreach ($d in $extra) {
            if (Test-Path $d) { echo $d | Out-File -FilePath $env:GITHUB_PATH -Append }
          }
      # deps/ is self-healing: get-deps.ts moves each checkout to its pinned
      # commit and refreshes testimages by stamp, so a prefix restore is safe.
      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-v2-windows-${{ hashFiles('cmd/get-deps.ts', 'cmd/gen_*.ts') }}
          restore-keys: |
            deps-v2-windows-
      # Oracle builds are not: build.ts skips a build whose library exists, so
      # restoring one made with other flags would be used as is. Exact key only.
      - name: Cache oracle builds
        uses: actions/cache@v6
        with:
          path: |
            out/dav1d_build
            out/libde265_build
            out/libheif_build
            out/zlib_build
            out/brotli_build
          key: oracle-v2-windows-${{ hashFiles('cmd/get-deps.ts', 'cmd/build.ts') }}
      - name: Clone deps + testimages
        run: bun cmd/get-deps.ts
      - name: Oracle tests (MSVC)
        run: bun cmd/tests.ts -all -msvc
      - name: Amalgamation
        # WASM is built and verified in its own job.
        run: bun cmd/build-dist.ts -no-wasm

  windows-clang-fuzz:
    name: Windows clang ASan crash regression
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: MSVC environment (clang from VS)
        uses: ilammy/msvc-dev-cmd@v1
      # -check-crashes -no-deps needs no deps/ checkout (pure-C harness).
      - name: Replay tracked fuzz crashes under ASan
        run: bun cmd/fuzz.ts -check-crashes -no-deps

  linux:
    name: Linux clang + tests + crashes
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build meson nasm cmake pkg-config
          major=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get install -y "libfuzzer-${major}-dev" || \
            sudo apt-get install -y "libclang-rt-${major}-dev" || true
      # deps/ is self-healing: get-deps.ts moves each checkout to its pinned
      # commit and refreshes testimages by stamp, so a prefix restore is safe.
      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-v2-linux-${{ hashFiles('cmd/get-deps.ts', 'cmd/gen_*.ts') }}
          restore-keys: |
            deps-v2-linux-
      # Oracle builds are not: build.ts skips a build whose library exists, so
      # restoring one made with other flags would be used as is. Exact key only.
      - name: Cache oracle builds
        uses: actions/cache@v6
        with:
          path: |
            out/dav1d_build
            out/libde265_build
            out/libheif_build
            out/zlib_build
            out/brotli_build
          key: oracle-v2-linux-${{ hashFiles('cmd/get-deps.ts', 'cmd/build.ts') }}
      - name: Clone deps + testimages
        run: bun cmd/get-deps.ts
      - name: Oracle tests (clang)
        run: bun cmd/tests.ts -all -clang
      - name: Amalgamation
        # WASM is built and verified in its own job.
        run: bun cmd/build-dist.ts -no-wasm
      # Every fuzz target must keep compiling, also under MemorySanitizer.
      - name: Build fuzz targets (ASan + UBSan, MSan)
        run: |
          bun cmd/fuzz.ts -build-only -no-deps
          bun cmd/fuzz.ts -build-only -msan
      # All tracked artifacts, each with the target that found it; UBSan is
      # on by default on Linux and its findings are fatal.
      - name: Fuzz crashes (ASan + UBSan)
        run: bun cmd/fuzz.ts -check-crashes -no-deps

  macos:
    name: macOS clang + tests
    runs-on: macos-latest
    timeout-minutes: 120
    # The RExt conformance set (49 streams) runs on Linux only: it checks the
    # portable C decoder against MD5s and tripled the run time here.
    env:
      HEIC_SKIP_REXT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: System packages
        run: brew install meson ninja nasm cmake
      # deps/ is self-healing: get-deps.ts moves each checkout to its pinned
      # commit and refreshes testimages by stamp, so a prefix restore is safe.
      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-v2-macos-${{ hashFiles('cmd/get-deps.ts', 'cmd/gen_*.ts') }}
          restore-keys: |
            deps-v2-macos-
      # Oracle builds are not: build.ts skips a build whose library exists, so
      # restoring one made with other flags would be used as is. Exact key only.
      - name: Cache oracle builds
        uses: actions/cache@v6
        with:
          path: |
            out/dav1d_build
            out/libde265_build
            out/libheif_build
            out/zlib_build
            out/brotli_build
          key: oracle-v2-macos-${{ hashFiles('cmd/get-deps.ts', 'cmd/build.ts') }}
      - name: Clone deps + testimages
        run: bun cmd/get-deps.ts
      - name: Oracle tests (clang)
        # Apple clang is on the runner; -clang is the default off Windows but
        # keep it explicit so this job stays parallel to linux.
        run: bun cmd/tests.ts -all -clang
      - name: Amalgamation
        # WASM is built and verified in its own job.
        run: bun cmd/build-dist.ts -no-wasm

  wasm:
    name: WASM decode smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-v2-linux-wasm-${{ hashFiles('cmd/get-deps.ts', 'cmd/build-wasm.ts') }}
          restore-keys: |
            deps-v2-linux-wasm-
      - name: Clone deps (repos only)
        env:
          HEIC_SKIP_TESTIMAGES: "1"
        run: bun cmd/get-deps.ts
      - name: Build amalgamation + WASM
        run: bun cmd/build-dist.ts
      - name: Verify WASM decode
        run: bun cmd/verify-wasm.ts deps/heic/testdata/features/single.heic
