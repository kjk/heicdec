# CI for heicdec — host build, amalgamation, full pixel-oracle tests against
# libheif on Windows, Linux, and macOS, plus fuzz crash regression and WASM.
#
# `bun cmd/tests.ts -all` builds the oracle stack (dav1d + libde265 + libheif)
# and needs deps/ + deps/testimages. Both are cached per OS so cold runs pay
# clone/download/build once and warm runs stay shorter.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache

jobs:
  windows-msvc:
    name: Windows MSVC + tests
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install meson/ninja/nasm
        shell: pwsh
        run: |
          python -m pip install --upgrade meson
          choco install ninja nasm -y --no-progress
          # choco ninja/nasm may land off PATH until the next shell; add common dirs.
          $extra = @(
            "C:\ProgramData\chocolatey\bin",
            "C:\Program Files\NASM"
          )
          foreach ($d in $extra) {
            if (Test-Path $d) { echo $d | Out-File -FilePath $env:GITHUB_PATH -Append }
          }
      - name: Cache deps + oracle builds
        uses: actions/cache@v4
        with:
          path: |
            deps
            out/dav1d_build
            out/libde265_build
            out/libheif_build
            out/zlib_build
            out/brotli_build
          key: deps-v1-windows-${{ hashFiles('cmd/get-deps.ts', 'cmd/build.ts', 'cmd/corpus.ts') }}
          restore-keys: |
            deps-v1-windows-
      - name: Clone deps + testimages
        run: bun cmd/get-deps.ts
      - name: Oracle tests (MSVC)
        run: bun cmd/tests.ts -all -msvc
      - name: Amalgamation
        run: bun cmd/build-dist.ts

  windows-clang-fuzz:
    name: Windows clang ASan crash regression
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: MSVC environment (clang from VS)
        uses: ilammy/msvc-dev-cmd@v1
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-v1-windows-fuzz-${{ hashFiles('cmd/get-deps.ts') }}
          restore-keys: |
            deps-v1-windows-fuzz-
            deps-v1-windows-
      - name: Clone deps (repos only)
        env:
          HEIC_SKIP_TESTIMAGES: "1"
        run: bun cmd/get-deps.ts
      - name: Replay tracked fuzz crashes under ASan
        run: bun cmd/fuzz.ts -check-crashes -no-deps

  linux:
    name: Linux clang + tests + crashes
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build meson nasm cmake pkg-config
          major=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get install -y "libfuzzer-${major}-dev" || \
            sudo apt-get install -y "libclang-rt-${major}-dev" || true
      - name: Cache deps + oracle builds
        uses: actions/cache@v4
        with:
          path: |
            deps
            out/dav1d_build
            out/libde265_build
            out/libheif_build
            out/zlib_build
            out/brotli_build
          key: deps-v1-linux-${{ hashFiles('cmd/get-deps.ts', 'cmd/build.ts', 'cmd/corpus.ts') }}
          restore-keys: |
            deps-v1-linux-
      - name: Clone deps + testimages
        run: bun cmd/get-deps.ts
      - name: Oracle tests (clang)
        run: bun cmd/tests.ts -all -clang
      - name: Amalgamation
        run: bun cmd/build-dist.ts
      - name: Fuzz crashes (ASan + UBSan)
        env:
          HEIC_FUZZ_UBSAN: "1"
        run: bun cmd/fuzz.ts -check-crashes -no-deps

  macos:
    name: macOS clang + tests
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: System packages
        run: brew install meson ninja nasm cmake
      - name: Cache deps + oracle builds
        uses: actions/cache@v4
        with:
          path: |
            deps
            out/dav1d_build
            out/libde265_build
            out/libheif_build
            out/zlib_build
            out/brotli_build
          key: deps-v1-macos-${{ hashFiles('cmd/get-deps.ts', 'cmd/build.ts', 'cmd/corpus.ts') }}
          restore-keys: |
            deps-v1-macos-
      - name: Clone deps + testimages
        run: bun cmd/get-deps.ts
      - name: Oracle tests (clang)
        # Apple clang is on the runner; -clang is the default off Windows but
        # keep it explicit so this job stays parallel to linux.
        run: bun cmd/tests.ts -all -clang
      - name: Amalgamation
        run: bun cmd/build-dist.ts

  wasm:
    name: WASM decode smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-v1-linux-wasm-${{ hashFiles('cmd/get-deps.ts', 'cmd/build-wasm.ts') }}
          restore-keys: |
            deps-v1-linux-wasm-
            deps-v1-linux-
      - name: Clone deps (repos only)
        env:
          HEIC_SKIP_TESTIMAGES: "1"
        run: bun cmd/get-deps.ts
      - name: Build amalgamation + WASM
        run: bun cmd/build-dist.ts
      - name: Verify WASM decode
        run: bun cmd/verify-wasm.ts deps/heic/testdata/features/single.heic
